// Sistema de Carrito
let cart = JSON.parse(localStorage.getItem('sizzle_cart')) || [];

function saveCart() {
  localStorage.setItem('sizzle_cart', JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  if (badge) {
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    badge.textContent = total;
    badge.classList.toggle('hidden', total === 0);
  }
}

function addToCart(productId, name, price, image) {
  const existing = cart.find(item => item.id === productId);
  if (existing) {
    existing.quantity++;
  } else {
    cart.push({ id: productId, name, price, image, quantity: 1 });
  }
  saveCart();
  
  const btn = event?.target?.closest('button');
  if (btn) {
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined">check</span> Added!';
    setTimeout(() => { btn.innerHTML = originalText; }, 1500);
  }
}

function renderProducts(filter = "all", search = "") {
  const container = document.getElementById('products-grid');
  if (!container) return;
  
  let filtered = products;
  if (filter !== "all") filtered = filtered.filter(p => p.category === filter);
  if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.desc.toLowerCase().includes(search.toLowerCase()));
  
  container.innerHTML = filtered.map(p => `
    <div class="bg-white rounded-3xl overflow-hidden shadow-md hover:shadow-xl transition-all flex flex-col group">
      <div class="h-56 overflow-hidden relative"><img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"></div>
      <div class="p-md flex flex-col flex-1">
        <div class="flex justify-between items-start mb-2"><h3 class="font-headline-md text-headline-md">${p.name}</h3><span class="font-price-display text-price-display text-primary">$${p.price}</span></div>
        <p class="text-on-surface-variant font-body-md mb-md flex-grow">${p.desc}</p>
        <button onclick="addToCart('${p.id}', '${p.name}', ${p.price}, '${p.image}')" class="w-full bg-primary-container text-on-primary py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all">
          <span class="material-symbols-outlined">add_shopping_cart</span> Add to Cart
        </button>
      </div>
    </div>
  `).join('');
}

// Inicialización
document.addEventListener('DOMContentLoaded', () => {
  renderProducts();
  updateCartBadge();
  window.addToCart = addToCart;
  
  // Filtros por categoría
  document.querySelectorAll('#category-filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#category-filters button').forEach(b => {
        b.classList.remove('bg-inverse-surface', 'text-white');
        b.classList.add('bg-secondary-container', 'text-on-surface');
      });
      btn.classList.remove('bg-secondary-container', 'text-on-surface');
      btn.classList.add('bg-inverse-surface', 'text-white');
      const searchVal = document.getElementById('search-input')?.value || '';
      renderProducts(btn.dataset.cat, searchVal);
    });
  });
  
  // Búsqueda
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const activeCat = document.querySelector('#category-filters button.bg-inverse-surface')?.dataset.cat || 'all';
      renderProducts(activeCat, e.target.value);
    });
  }
});
