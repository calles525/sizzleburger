let cart = JSON.parse(localStorage.getItem('sizzle_cart')) || [];

function saveCart() {
  localStorage.setItem('sizzle_cart', JSON.stringify(cart));
  updateCartBadge();
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  if (badge) {
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    badge.textContent = total;
  }
}

// Función mejorada para agregar al carrito
function addToCart(productId, name, price, image, eventElement = null) {
  const existing = cart.find(item => item.id === productId);
  if (existing) {
    existing.quantity++;
  } else {
    cart.push({ id: productId, name, price, image, quantity: 1 });
  }
  saveCart();
  
  // feedback visual en el botón
  let btn = null;
  if (eventElement) {
    btn = eventElement;
  } else if (window.event && window.event.target) {
    btn = window.event.target.closest('button');
  }
  
  if (btn) {
    const originalInner = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined text-sm md:text-base">check_circle</span> Added!';
    btn.classList.add('scale-active');
    setTimeout(() => {
      if (btn) {
        btn.innerHTML = originalInner;
        btn.classList.remove('scale-active');
      }
    }, 1200);
  }
}

// Renderizado con diseño responsive: en móvil (width <= 640px) se mostrará horizontal (imagen izquierda, texto derecha)
// En desktop mantiene el layout vertical original.
function renderProducts(filter = "all", search = "") {
  const container = document.getElementById('products-grid');
  if (!container) return;
  
  let filtered = products;
  if (filter !== "all") filtered = filtered.filter(p => p.category === filter);
  if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.desc.toLowerCase().includes(search.toLowerCase()));
  
  // Detectar si es móvil mediante matchMedia (pantalla hasta 640px)
  const isMobile = window.matchMedia("(max-width: 640px)").matches;
  
  if (isMobile) {
    // Modo móvil: cards horizontales con imagen izquierda, texto derecha
    container.classList.add("products-mobile-list");
    container.classList.remove("grid", "sm:grid-cols-2", "lg:grid-cols-3", "xl:grid-cols-4");
    container.innerHTML = filtered.map(p => `
      <div class="bg-white rounded-2xl shadow-md hover:shadow-lg transition-all product-card-transition mobile-horizontal-card overflow-hidden">
        <div class="product-img-container w-28 h-auto flex-shrink-0">
          <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" style="min-height: 110px;">
        </div>
        <div class="product-info flex-1 flex flex-col justify-between py-1 pr-1">
          <div>
            <div class="product-header flex justify-between items-baseline flex-wrap gap-1">
              <h3 class="product-title font-extrabold text-on-surface">${p.name}</h3>
              <span class="product-price font-price-display text-primary font-extrabold">$${p.price}</span>
            </div>
            <p class="product-desc text-on-surface-variant text-xs leading-tight mt-1">${p.desc}</p>
          </div>
          <button class="add-btn w-full bg-primary-container text-on-primary font-bold rounded-xl flex items-center justify-center gap-1 active:scale-95 transition-all mt-2 py-2 text-xs">
            <span class="material-symbols-outlined text-sm">add_shopping_cart</span> Add to Cart
          </button>
        </div>
      </div>
    `).join('');
  } else {
    // Modo escritorio / tablet: layout vertical original con grid
    container.classList.remove("products-mobile-list");
    container.classList.add("grid", "sm:grid-cols-2", "lg:grid-cols-3", "xl:grid-cols-4");
    container.innerHTML = filtered.map(p => `
      <div class="bg-white rounded-2xl md:rounded-3xl overflow-hidden shadow-md hover:shadow-xl transition-all flex flex-col group">
        <div class="h-48 md:h-56 overflow-hidden relative"><img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"></div>
        <div class="p-4 md:p-md flex flex-col flex-1">
          <div class="flex justify-between items-start mb-2"><h3 class="font-bold text-lg md:text-headline-md">${p.name}</h3><span class="font-price-display text-price-display text-primary text-base md:text-xl">$${p.price}</span></div>
          <p class="text-on-surface-variant font-body-md text-sm md:text-base mb-3 md:mb-md flex-grow">${p.desc}</p>
          <button class="w-full bg-primary-container text-on-primary py-2.5 md:py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-all text-sm md:text-base">
            <span class="material-symbols-outlined text-base md:text-xl">add_shopping_cart</span> Add to Cart
          </button>
        </div>
      </div>
    `).join('');
  }
  
  // Asignar eventos a todos los botones "Add to Cart" después de renderizar (para ambos modos)
  document.querySelectorAll('#products-grid button').forEach(btn => {
    // Buscar el producto asociado al botón
    const card = btn.closest('.mobile-horizontal-card, .bg-white');
    if (!card) return;
    let productItem = null;
    // Extraer nombre y precio desde elementos cercanos
    let nameEl, priceEl;
    if (isMobile) {
      nameEl = card.querySelector('.product-title');
      priceEl = card.querySelector('.product-price');
    } else {
      nameEl = card.querySelector('h3');
      priceEl = card.querySelector('.text-primary');
    }
    if (nameEl && priceEl) {
      const rawName = nameEl.innerText.trim();
      const rawPrice = parseFloat(priceEl.innerText.replace('$', ''));
      const imgSrc = card.querySelector('img')?.src || '';
      const foundProduct = products.find(p => p.name === rawName && Math.abs(p.price - rawPrice) < 0.01);
      if (foundProduct) {
        productItem = foundProduct;
      } else {
        // fallback por nombre
        productItem = products.find(p => p.name === rawName);
      }
      if (productItem) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          addToCart(productItem.id, productItem.name, productItem.price, productItem.image, btn);
        });
      }
    }
  });
}

// Manejo de resize para redibujar correctamente en cambio de orientación / tamaño
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const activeCat = document.querySelector('#category-filters button.bg-inverse-surface')?.dataset.cat || 'all';
    const searchVal = document.getElementById('search-input')?.value || '';
    renderProducts(activeCat, searchVal);
  }, 150);
});

document.addEventListener('DOMContentLoaded', () => {
  renderProducts();
  updateCartBadge();
  window.addToCart = addToCart;
  
  // Filtros por categoría
  document.querySelectorAll('#category-filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#category-filters button').forEach(b => {
        b.classList.remove('bg-inverse-surface', 'text-white');
        b.classList.add('bg-secondary-container', 'text-on-surface');
      });
      btn.classList.remove('bg-secondary-container', 'text-on-surface');
      btn.classList.add('bg-inverse-surface', 'text-white');
      const searchVal = document.getElementById('search-input')?.value || '';
      renderProducts(btn.dataset.cat, searchVal);
    });
  });
  
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const activeCat = document.querySelector('#category-filters button.bg-inverse-surface')?.dataset.cat || 'all';
      renderProducts(activeCat, e.target.value);
    });
  }

  // Menú móvil
  const menuBtn = document.getElementById('menu-btn');
  const closeBtn = document.getElementById('close-menu');
  const mobileMenu = document.getElementById('mobile-menu');
  if (menuBtn) {
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    });
  }
  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      mobileMenu.classList.add('hidden');
      document.body.style.overflow = '';
    });
  }
});
</script>
</body>
</html>
